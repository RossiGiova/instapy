{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<h1 class="text-center mb-4">{{ page_title }}</h1>
{% for post in posts %}
<div class="d-flex justify-content-center mb-5">
    <div class="post-wrapper w-100">{% include "posts/_post_card.html" %}</div>
</div>
{% empty %}
<p class="text-center text-body-secondary my-5 fs-5">{{ empty_message }}</p>
{% endfor %}
{% include "partials/_pagination.html" %}
{% endblock %}
